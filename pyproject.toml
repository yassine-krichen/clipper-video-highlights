[project]
name = "clipper"
version = "0.1.0"
description = "long-form video to short-form clips: extraction engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",           # every on-disk data type is a pydantic v2 model (spec section 3)
    "pydantic-settings",      # yaml + env config loading (spec section 2.1)
    "typer",                  # cli framework (spec section 5)
    "pyyaml",                 # config.yaml and hooks.yaml parsing
    "openai",                 # all llm calls (generation, judging, transcription) route through freellmapi, an openai-compatible proxy
    "faster-whisper",         # fallback local transcriber (spec section 4.2)
    "sentence-transformers",  # local embeddings for semantic dedupe (spec section 4.10, embedder: local)
]

[project.scripts]
clipper = "clipper.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",  # llm client and judge stage are async
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real local model inference (e.g. faster-whisper) -- deselect with -m 'not slow'",
]
